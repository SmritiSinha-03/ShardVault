<!doctype html>
<!-- Source of docs/architecture.png. Open in a browser and take a 1400x860
     screenshot (or run: python docs/render_diagram.py) after editing. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ShardVault architecture</title>
<style>
  @font-face {
    font-family: "Archivo";
    src: url("../app/static/fonts/archivo-variable.woff2") format("woff2-variations");
    font-weight: 100 900;
    font-stretch: 62% 125%;
  }
  html, body { margin: 0; background: #e4e8ee; }
  svg { display: block; font-family: "Archivo", "Segoe UI", sans-serif; }
  .title { font-size: 30px; font-weight: 800; font-stretch: 118%; fill: #11151d; }
  .subtitle { font-size: 16px; fill: #586073; }
  .box { fill: #f6f7f9; stroke: #11151d; stroke-width: 1.6; }
  .box-title { font-size: 20px; font-weight: 760; font-stretch: 115%; fill: #11151d; }
  .box-tag { font-size: 13px; font-weight: 600; fill: #586073; }
  .item { font-size: 15px; fill: #2a303c; }
  .compose { fill: none; stroke: #7c8597; stroke-width: 1.5; stroke-dasharray: 8 6; }
  .compose-label { font-size: 15px; font-weight: 700; fill: #586073; }
  .drive { fill: #1b212c; stroke: #2d3543; }
  .drive-title { font-size: 18px; font-weight: 760; font-stretch: 115%; fill: #e8ecf2; }
  .drive-sub { font-size: 13px; fill: #8f98aa; }
  .chip-data { fill: #5b8cff; }
  .chip-parity { fill: none; stroke: #2fd07f; stroke-width: 2; }
  .chip-text { font-size: 14px; font-weight: 650; fill: #ffffff; }
  .chip-text-parity { font-size: 14px; font-weight: 650; fill: #2fd07f; }
  .chip-size { font-size: 13px; fill: #8f98aa; }
  .meta { font-size: 13px; fill: #8f98aa; }
  .led { fill: #2fd07f; }
  .flow { stroke: #11151d; stroke-width: 2; fill: none; }
  .flow-admin { stroke: #586073; stroke-width: 2; fill: none; stroke-dasharray: 2 5; stroke-linecap: round; }
  .flow-mount { stroke: #c4282b; stroke-width: 2; fill: none; stroke-dasharray: 9 6; }
  .label { font-size: 14px; font-weight: 650; fill: #11151d; }
  .label-muted { font-size: 13px; fill: #586073; }
  .label-mount { font-size: 14px; font-weight: 650; fill: #c4282b; }
  .pill { fill: #11151d; }
  .pill-text { font-size: 12px; font-weight: 700; fill: #f6f7f9; }
</style>
</head>
<body>
<svg width="1400" height="860" viewBox="0 0 1400 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ShardVault architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#11151d" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#586073" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4282b" />
    </marker>
  </defs>

  <text x="40" y="52" class="title">ShardVault architecture</text>
  <text x="40" y="78" class="subtitle">Self-healing object storage: MinIO erasure coding across four drives, with a dashboard to watch it work.</text>

  <!-- Browser -->
  <rect x="40" y="250" width="240" height="190" rx="12" class="box" />
  <text x="62" y="288" class="box-title">Browser</text>
  <text x="62" y="310" class="box-tag">You, on the laptop</text>
  <text x="62" y="346" class="item">Dashboard</text>
  <text x="62" y="366" class="label-muted">localhost:8000</text>
  <text x="62" y="400" class="item">MinIO Console</text>
  <text x="62" y="420" class="label-muted">localhost:9001</text>

  <!-- Docker Compose boundary -->
  <rect x="330" y="110" width="1040" height="720" rx="18" class="compose" />
  <text x="352" y="138" class="compose-label">Docker Compose on your laptop</text>

  <!-- App container -->
  <rect x="370" y="160" width="390" height="240" rx="12" class="box" />
  <rect x="390" y="178" width="118" height="24" rx="12" class="pill" />
  <text x="402" y="195" class="pill-text">app container</text>
  <text x="390" y="234" class="box-title">ShardVault app</text>
  <text x="390" y="266" class="item">Flask web app and JSON API</text>
  <text x="390" y="292" class="item">boto3, the AWS SDK for Amazon S3</text>
  <text x="390" y="318" class="item">SHA-256 integrity check per file</text>
  <text x="390" y="344" class="item">Disk inspector and failure injector</text>
  <text x="390" y="378" class="label-muted">Python 3.12, gunicorn</text>

  <!-- MinIO container -->
  <rect x="940" y="160" width="390" height="240" rx="12" class="box" />
  <rect x="960" y="178" width="130" height="24" rx="12" class="pill" />
  <text x="972" y="195" class="pill-text">minio container</text>
  <text x="960" y="234" class="box-title">MinIO object storage</text>
  <text x="960" y="266" class="item">S3-compatible API on port 9000</text>
  <text x="960" y="292" class="item">Erasure coding EC:2 (Reed-Solomon)</text>
  <text x="960" y="318" class="item">Automatic healing of replaced drives</text>
  <text x="960" y="344" class="item">Admin API: drive health, heal</text>
  <text x="960" y="378" class="label-muted">Open source, AGPLv3</text>

  <!-- Browser -> app -->
  <path d="M280 330 L366 330" class="flow" marker-end="url(#arrow)" />
  <text x="288" y="318" class="label-muted">HTTP</text>

  <!-- Browser -> console (dotted, over the top) -->
  <path d="M160 250 L160 120 Q160 100 180 100 L1135 100 Q1155 100 1155 120 L1155 156" class="flow-admin" marker-end="url(#arrow-muted)" />
  <text x="560" y="94" class="label-muted">MinIO Console (port 9001): browse buckets and drives</text>

  <!-- app -> minio -->
  <path d="M760 236 L936 236" class="flow" marker-end="url(#arrow)" />
  <text x="776" y="224" class="label">S3 API</text>
  <text x="776" y="256" class="label-muted">PUT, GET, LIST, DELETE</text>
  <text x="776" y="274" class="label-muted">signed with AWS SigV4</text>
  <path d="M760 336 L936 336" class="flow-admin" marker-end="url(#arrow-muted)" />
  <text x="776" y="326" class="label-muted">Admin API: info, heal</text>

  <!-- minio -> drives bus -->
  <path d="M1135 400 L1135 462" class="flow" />
  <path d="M542 462 L1228 462" class="flow" />
  <path d="M542 462 L542 512" class="flow" marker-end="url(#arrow)" />
  <path d="M770 462 L770 512" class="flow" marker-end="url(#arrow)" />
  <path d="M999 462 L999 512" class="flow" marker-end="url(#arrow)" />
  <path d="M1228 462 L1228 512" class="flow" marker-end="url(#arrow)" />
  <text x="560" y="450" class="label">Each file is cut into 2 data + 2 parity shards, one shard per drive</text>

  <!-- Drives -->
  <g>
    <rect x="440" y="516" width="204" height="210" rx="10" class="drive" />
    <circle cx="462" cy="545" r="5" class="led" />
    <text x="476" y="551" class="drive-title">Disk 1</text>
    <text x="460" y="574" class="drive-sub">volume disk1 → /data1</text>
    <rect x="460" y="594" width="164" height="34" rx="5" class="chip-data" />
    <text x="472" y="616" class="chip-text">Data shard 1</text>
    <text x="460" y="652" class="chip-size">photo.jpg: 1.5 MB</text>
    <text x="460" y="706" class="meta">.minio.sys/format.json</text>
  </g>
  <g>
    <rect x="668" y="516" width="204" height="210" rx="10" class="drive" />
    <circle cx="690" cy="545" r="5" class="led" />
    <text x="704" y="551" class="drive-title">Disk 2</text>
    <text x="688" y="574" class="drive-sub">volume disk2 → /data2</text>
    <rect x="688" y="594" width="164" height="34" rx="5" class="chip-data" />
    <text x="700" y="616" class="chip-text">Data shard 2</text>
    <text x="688" y="652" class="chip-size">photo.jpg: 1.5 MB</text>
    <text x="688" y="706" class="meta">.minio.sys/format.json</text>
  </g>
  <g>
    <rect x="897" y="516" width="204" height="210" rx="10" class="drive" />
    <circle cx="919" cy="545" r="5" class="led" />
    <text x="933" y="551" class="drive-title">Disk 3</text>
    <text x="917" y="574" class="drive-sub">volume disk3 → /data3</text>
    <rect x="918" y="595" width="162" height="32" rx="5" class="chip-parity" />
    <text x="929" y="616" class="chip-text-parity">Parity shard 1</text>
    <text x="917" y="652" class="chip-size">photo.jpg: 1.5 MB</text>
    <text x="917" y="706" class="meta">.minio.sys/format.json</text>
  </g>
  <g>
    <rect x="1126" y="516" width="204" height="210" rx="10" class="drive" />
    <circle cx="1148" cy="545" r="5" class="led" />
    <text x="1162" y="551" class="drive-title">Disk 4</text>
    <text x="1146" y="574" class="drive-sub">volume disk4 → /data4</text>
    <rect x="1147" y="595" width="162" height="32" rx="5" class="chip-parity" />
    <text x="1158" y="616" class="chip-text-parity">Parity shard 2</text>
    <text x="1146" y="652" class="chip-size">photo.jpg: 1.5 MB</text>
    <text x="1146" y="706" class="meta">.minio.sys/format.json</text>
  </g>

  <!-- app mounts the same volumes -->
  <path d="M400 400 L400 772 L1228 772" class="flow-mount" />
  <path d="M542 772 L542 730" class="flow-mount" marker-end="url(#arrow-red)" />
  <path d="M770 772 L770 730" class="flow-mount" marker-end="url(#arrow-red)" />
  <path d="M999 772 L999 730" class="flow-mount" marker-end="url(#arrow-red)" />
  <path d="M1228 772 L1228 730" class="flow-mount" marker-end="url(#arrow-red)" />
  <text x="440" y="800" class="label-mount">The app mounts the same four volumes: it shows which shards each disk holds, and can erase a disk to cause a real drive failure</text>

  <!-- Legend -->
  <g transform="translate(40, 560)">
    <text x="0" y="0" class="label">Any 2 shards</text>
    <text x="0" y="20" class="label">rebuild the file.</text>
    <text x="0" y="52" class="label-muted">Lose any 2 disks:</text>
    <text x="0" y="70" class="label-muted">reads still work.</text>
    <text x="0" y="98" class="label-muted">Writes need 3 disks</text>
    <text x="0" y="116" class="label-muted">(write quorum).</text>
    <text x="0" y="144" class="label-muted">A wiped disk is</text>
    <text x="0" y="162" class="label-muted">rebuilt automatically.</text>
  </g>
</svg>
</body>
</html>
